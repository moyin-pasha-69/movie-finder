<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genre Page</title>
    <link rel="stylesheet" href="../css/customStyle.css" />
    <link rel="stylesheet" href="../css/output.css" />
    <script
      src="https://kit.fontawesome.com/cccffbd662.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-[#0A0A0A] pt-20">
    <header class="w-full bg-[#2A2A3A] fixed top-0 z-50 h-20">
      <div
        class="header-item flex justify-between items-center px-2 sm:px-4 lg:px-8 py-4 max-w-[1440px] w-full mx-auto z-50"
      >
        <!-- title -->
        <h1 class="text-[#00ffff] font-extrabold sm:text-xl text-sm mr-4">
          MOVIE <span class="text-[#00ff00]">FINDER</span>
        </h1>

        <div
          class="head-movie-title text-[#e0e0e0] font-extrabold text-sm sm:text-3xl lg:text-4xl w-full mx-auto text-center truncate"
        ></div>
        <!-- icons -->
        <div
          class="icons nav-icons flex ml-4 gap-4 justify-center items-center"
        >
          <div class="toggle icon">
            <i class="fa-solid fa-circle-half-stroke"></i>
          </div>
          <div class="user icon">
            <i class="fa-solid fa-circle-user"></i>
          </div>
        </div>
      </div>
    </header>

    <main
      class="max-w-[1440px] w-full mx-auto px-4 md:px-8 lg:px-12 h-full relative pt-10"
    >
      <!-- pagination -->
      <section class="genre-page-pagination-section"></section>

      <!-- cards section -->
      <section class="card-section genre-movies-section"></section>

      <!-- loader  -->
      <section class="hidden loader">
        <div class="flex flex-col justify-center items-center gap-4">
          <div
            class="w-20 h-20 rounded-full border-8 border-[#3A3A3A] border-t-[#00ff00] border-r-[#00ffff] animate-spin"
          ></div>
          <p
            class="text-[#00ffff] duration-700 text-sm animate-pulse font-mono"
          >
            FETCHING MOVIES...
          </p>
        </div>
      </section>
    </main>

    <!-- footer -->
    <footer
      class="foot bg-[#03030A] border-t border-[#3a3a3a] text-white pt-8 px-10 pb-8"
    >
      <div class="footUp grid grid-cols-4">
        <div class="logo col-span-2">
          <img src="/assets/logo/logo.png" alt="logo" class="w-28 h-28" />
          <p class="font-extrabold text-xl">
            Discover movies and find your next favorite
          </p>
        </div>
        <div class="pageMarks">
          <h2 class="mt-10 font-extrabold text-xl">EXPLORE</h2>
          <div class="flex flex-col gap-2 mt-8">
            <a href="#home" class="hover:underline font-semibold">Home</a>
            <a href="#trending" class="hover:underline font-semibold">
              Trending
            </a>
            <a href="#genre " class="hover:underline font-semibold">Genre</a>
          </div>
        </div>
        <div class="connection">
          <h2 class="mt-10 font-extrabold text-xl">CONNECT</h2>
          <div class="flex flex-col gap-2 mt-8">
            <a
              href="https://github.com/moyin-pasha-69"
              class="hover:underline font-semibold"
              >Github</a
            >
            <a
              href="https://www.linkedin.com/in/moyin-pasha-7a68aa330/"
              class="hover:underline font-semibold"
              >Linkedin</a
            >
            <a
              href="https://moyin-pasha-69.github.io/weather-dashboard/"
              class="hover:underline font-semibold"
              >other projects..</a
            >
          </div>
        </div>
      </div>
      <div class="footdown">
        <div class="api-validation">
          <p class="inline-block font-medium">
            This product uses the
            <img
              src="https://www.themoviedb.org/assets/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg"
              alt=""
              class="w-40 h-40 inline mx-4"
            />
            API but is not endorsed or certified by TMDB.
          </p>
        </div>
        <div class="copyright flex justify-center items-center">
          <p>© 2026 Movie Finder Built by Moyin Pasha</p>
        </div>
      </div>
    </footer>
    <script type="module" src="../js/genre-page.js"></script>
  </body>
</html>
